name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Notes from CHANGELOG
        id: extract_changelog
        run: |
          node -e '
            const fs = require("fs");
            const ver = (process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            let found = false;
            const out = [];
            for (const line of lines) {
              if (line.startsWith("## [" + ver + "]")) { found = true; continue; }
              if (found && line.startsWith("## [")) { break; }
              if (found) { out.push(line); }
            }
            const notes = out.join("\n").trim();
            fs.writeFileSync("release_notes.md", notes || ("Release " + process.env.GITHUB_REF_NAME));
          '
          echo "--- Extracted Release Notes ---"
          cat release_notes.md

      - name: Delete Existing Release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md
