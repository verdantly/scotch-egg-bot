name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Notes from CHANGELOG
        id: extract_changelog
        run: |
          node -e '
            const fs = require("fs");
            const ver = (process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            let found = false;
            const out = [];
            for (const line of lines) {
              if (line.startsWith("## [" + ver + "]")) { found = true; continue; }
              if (found && line.startsWith("## [")) { break; }
              if (found) { out.push(line); }
            }
            const notes = out.join("\n").trim();
            fs.writeFileSync("release_notes.md", notes || ("Release " + process.env.GITHUB_REF_NAME));
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
